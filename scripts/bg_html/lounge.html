<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
.scene{position:relative;width:1920px;height:1080px;background:linear-gradient(180deg,#e8eef2,#d5dee5);overflow:hidden}
.day{position:absolute;inset:0;background:radial-gradient(circle at 55% 20%,rgba(255,252,245,.9),transparent 55%)}
.win{position:absolute;left:380px;top:70px;width:1160px;height:640px;border:20px solid #f3f6f8;box-shadow:0 30px 80px rgba(30,50,70,.15),inset 0 0 40px rgba(255,255,255,.4);background:
 linear-gradient(180deg,#c8dff0 0%,#8eb8d4 42%,#4f8fb0 43%,#3a7a9a 100%)}
.horizon{position:absolute;left:0;right:0;top:42%;height:8%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);filter:blur(6px)}
.floor{position:absolute;left:0;right:0;bottom:0;height:280px;background:linear-gradient(180deg,#d9c8b0,#c4ae93)}
.sofa{position:absolute;left:180px;bottom:140px;width:720px;height:200px;border-radius:28px;background:linear-gradient(180deg,#8ea3ad,#6d828e);box-shadow:0 24px 40px rgba(0,0,0,.18)}
.back{position:absolute;left:220px;bottom:280px;width:280px;height:110px;border-radius:22px;background:#9eb1ba}
.back2{left:520px}
.plant{position:absolute;right:220px;bottom:260px;width:160px;height:260px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6ec08a,#2f6b46);box-shadow:40px 60px 0 -40px #3f8f5c}
.pot{position:absolute;right:255px;bottom:160px;width:90px;height:100px;border-radius:10px;background:linear-gradient(180deg,#c49a72,#8d6848)}
.rug{position:absolute;left:420px;bottom:40px;width:900px;height:90px;border-radius:50%;background:rgba(120,140,150,.25);filter:blur(2px)}
.dof{position:absolute;inset:0;backdrop-filter:blur(1.2px);background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(40,60,80,.16))}
</style></head><body><div class="scene">
<div class="day"></div><div class="win"><div class="horizon"></div></div>
<div class="floor"></div><div class="rug"></div>
<div class="sofa"></div><div class="back"></div><div class="back back2"></div>
<div class="plant"></div><div class="pot"></div><div class="dof"></div>
</div></body></html>
