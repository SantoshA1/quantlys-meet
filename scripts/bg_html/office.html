<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b1220}
.scene{position:relative;width:1920px;height:1080px;background:linear-gradient(180deg,#d9e6ef 0%,#b7c8d6 55%,#9aafbf 100%);font-family:system-ui}
.ceil{position:absolute;inset:0 0 auto 0;height:38%;background:radial-gradient(ellipse at 45% -10%,rgba(255,255,255,.85),transparent 60%)}
.glass{position:absolute;left:420px;top:90px;width:1080px;height:680px;background:
 linear-gradient(180deg,rgba(255,255,255,.35),rgba(180,210,230,.15)),
 linear-gradient(135deg,#c5d8e6,#9eb6c8);border:10px solid #6f8496;box-shadow:inset 0 0 80px rgba(255,255,255,.25),0 30px 80px rgba(20,40,60,.25);backdrop-filter:blur(2px)}
.mull{position:absolute;background:#5d7386}
.mull.v{width:6px;top:0;bottom:0}.mull.h{height:6px;left:0;right:0}
.col{position:absolute;top:40px;bottom:160px;width:110px;background:linear-gradient(90deg,#5b6b7a,#8a9aaa 40%,#4e5d6b);box-shadow:18px 0 40px rgba(0,0,0,.18)}
.col.l{left:90px}.col.r{right:90px}
.floor{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(180deg,#aebbc7,#8795a2);perspective:800px}
.tile{position:absolute;left:250px;right:250px;top:0;bottom:0;background:
 linear-gradient(90deg,transparent 49%,rgba(255,255,255,.12) 50%,transparent 51%),
 linear-gradient(0deg,transparent 49%,rgba(0,0,0,.06) 50%,transparent 51%);
 background-size:120px 80px;transform:perspective(700px) rotateX(58deg);transform-origin:top center;opacity:.9}
.desk{position:absolute;bottom:70px;height:34px;width:420px;border-radius:8px;background:linear-gradient(180deg,#6d7b88,#4c5864);box-shadow:0 18px 30px rgba(0,0,0,.25)}
.desk.a{left:250px}.desk.b{right:250px}
.neon{position:absolute;left:0;right:0;top:28px;height:5px;background:linear-gradient(90deg,#3de7ff,#7af0ff 40%,#2bb8d8);box-shadow:0 0 24px #3de7ff,0 0 60px rgba(61,231,255,.5)}
.plant{position:absolute;bottom:200px;left:300px;width:70px;height:110px;border-radius:40% 40% 45% 45%;background:radial-gradient(circle at 40% 30%,#5fba7c,#2d6b45);filter:blur(.3px);box-shadow:40px 10px 0 -10px #3f8f5d}
.dof{position:absolute;inset:0;backdrop-filter:blur(1.2px);pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(10,20,30,.18))}
</style></head><body><div class="scene">
<div class="ceil"></div><div class="neon"></div>
<div class="glass">
 <div class="mull v" style="left:25%"></div><div class="mull v" style="left:50%"></div><div class="mull v" style="left:75%"></div>
 <div class="mull h" style="top:33%"></div><div class="mull h" style="top:66%"></div>
</div>
<div class="col l"></div><div class="col r"></div>
<div class="floor"><div class="tile"></div></div>
<div class="desk a"></div><div class="desk b"></div>
<div class="plant"></div><div class="dof"></div>
</div></body></html>
